<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KAMA LEX - Espace de Gestion</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        nightBlue: '#0B132B',
                        cardBlue: '#1C2541',
                        gold: '#D4AF37',
                        goldHover: '#AA8C2C'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-nightBlue text-gray-100 min-h-screen flex flex-col font-sans">

    <!-- HEADER / LOGO SECTION -->
    <header class="bg-[#070D1D] border-b border-gold/30 py-4 px-6 flex justify-between items-center shadow-lg">
        <div class="flex items-center space-x-4">
            <!-- Emplacement Logo Officiel -->
            <div id="logo-container" class="h-12 w-12 rounded-full border-2 border-gold flex items-center justify-center bg-nightBlue overflow-hidden shadow-md">
                <!-- Remplacez le texte ci-dessous par votre balise <img> si vous utilisez une image, ex: <img src="logo.png" class="h-full w-full object-cover"> -->
                <span class="text-gold font-bold text-xl">KL</span>
            </div>
            <div>
                <h1 class="text-xl font-bold text-gold tracking-wide">KAMA LEX</h1>
                <p class="text-xs text-gray-400 italic">« Savoir pour mieux décider »</p>
            </div>
        </div>
        <div id="user-status" class="text-sm text-gray-300 hidden">
            Connecté : <span id="current-user-name" class="text-gold font-semibold"></span>
            <button onclick="logout()" class="ml-4 text-xs bg-red-600/80 hover:bg-red-600 text-white px-3 py-1 rounded transition">Déconnexion</button>
        </div>
    </header>

    <!-- MAIN CONTAINER -->
    <main class="flex-grow flex items-center justify-center p-6">
        
        <!-- ÉCRAN DE CONNEXION RAPIDE (3 PROFILS) -->
        <div id="login-screen" class="w-full max-w-md bg-cardBlue border border-gold/40 rounded-2xl p-8 shadow-2xl">
            <div class="text-center mb-8">
                <h2 class="text-2xl font-bold text-gold mb-2">Accès Équipe</h2>
                <p class="text-sm text-gray-300">Sélectionnez votre profil pour commencer</p>
            </div>

            <div class="space-y-4">
                <button onclick="selectProfile('ZOURE', 'Pilote')" class="w-full bg-nightBlue hover:bg-gold/10 border border-gold/50 hover:border-gold p-4 rounded-xl flex items-center justify-between transition group">
                    <div class="text-left">
                        <p class="text-lg font-bold text-gold group-hover:text-white">ZOURE Aboubakar</p>
                        <p class="text-xs text-gray-400">Pilote</p>
                    </div>
                    <span class="text-gold text-xl">→</span>
                </button>

                <button onclick="selectProfile('Abdoul', 'Closer')" class="w-full bg-nightBlue hover:bg-gold/10 border border-gold/50 hover:border-gold p-4 rounded-xl flex items-center justify-between transition group">
                    <div class="text-left">
                        <p class="text-lg font-bold text-gold group-hover:text-white">Abdoul</p>
                        <p class="text-xs text-gray-400">Closer</p>
                    </div>
                    <span class="text-gold text-xl">→</span>
                </button>

                <button onclick="selectProfile('OUEDRAOGO Adama', 'Formaliste')" class="w-full bg-nightBlue hover:bg-gold/10 border border-gold/50 hover:border-gold p-4 rounded-xl flex items-center justify-between transition group">
                    <div class="text-left">
                        <p class="text-lg font-bold text-gold group-hover:text-white">OUEDRAOGO Adama</p>
                        <p class="text-xs text-gray-400">Formaliste</p>
                    </div>
                    <span class="text-gold text-xl">→</span>
                </button>
            </div>
        </div>

        <!-- TABLEAU DE BORD INTERNE (Affiché après connexion) -->
        <div id="dashboard-screen" class="w-full max-w-4xl hidden bg-cardBlue border border-gold/40 rounded-2xl p-8 shadow-2xl">
            <h2 class="text-2xl font-bold text-gold mb-4">Tableau de Bord - KAMA LEX</h2>
            <p class="text-gray-300 mb-6">Bienvenue dans votre espace de pilotage. Prêt pour les opérations de ce soir.</p>
            
            <!-- Indicateurs de Performance / Plafonds -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="bg-nightBlue p-4 rounded-xl border border-gold/20">
                    <p class="text-xs text-gray-400">Plafond Coût d'Acquisition</p>
                    <p class="text-xl font-bold text-gold">8 000 FCFA</p>
                </div>
                <div class="bg-nightBlue p-4 rounded-xl border border-gold/20">
                    <p class="text-xs text-gray-400">Coût Max par Conversation</p>
                    <p class="text-xl font-bold text-gold">500 FCFA</p>
                </div>
            </div>
        </div>

    </main>

    <!-- SCRIPT LOGIQUE -->
    <script>
        // Configuration Supabase (Remplacez par vos clés si nécessaire)
        const SUPABASE_URL = 'VOTRE_SUPABASE_URL';
        const SUPABASE_ANON_KEY = 'VOTRE_SUPABASE_ANON_KEY';
        
        let supabaseClient = null;
        try {
            if (window.supabase && SUPABASE_URL !== 'VOTRE_SUPABASE_URL') {
                supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            }
        } catch (e) {
            console.warn("Supabase non configuré ou mode local actif.");
        }

        // Fonction de sélection de profil (Connexion rapide)
        function selectProfile(name, role) {
            localStorage.setItem('kamalex_user', JSON.stringify({ name, role }));
            updateSessionUI(name, role);
        }

        function updateSessionUI(name, role) {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('dashboard-screen').classList.remove('hidden');
            document.getElementById('user-status').classList.remove('hidden');
            document.getElementById('current-user-name').textContent = `${name} (${role})`;
        }

        function logout() {
            localStorage.removeItem('kamalex_user');
            document.getElementById('dashboard-screen').classList.add('hidden');
            document.getElementById('user-status').classList.add('hidden');
            document.getElementById('login-screen').classList.remove('hidden');
        }

        // Vérification automatique au chargement
        window.addEventListener('DOMContentLoaded', () => {
            const savedUser = localStorage.getItem('kamalex_user');
            if (savedUser) {
                const user = JSON.parse(savedUser);
                updateSessionUI(user.name, user.role);
            }
        });
    </script>
</body>
</html>
